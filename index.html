<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AUTOMAÇÃO INDUSTRIAL - 2339N25</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <style>
        body {
            background-color: #0f172a; 
            color: #e2e8f0;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .bento-card {
            background: #1e293b; 
            border: 1px solid #334155;
            border-radius: 1.5rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
        }
        .led-off {
            background-color: #334155;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
        }
        .led-on {
            background-color: #06b6d4; 
            box-shadow: 0 0 25px 5px rgba(6, 182, 212, 0.6), inset 0 0 10px rgba(255, 255, 255, 0.5);
        }
        .action-btn {
            transition: all 0.2s ease-in-out;
        }
        .action-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(6, 182, 212, 0.4);
        }
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 24px;
            width: 24px;
            border-radius: 50%;
            background: #06b6d4;
            cursor: pointer;
            margin-top: -8px;
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.8);
            border: 2px solid #fff;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 8px;
            cursor: pointer;
            background: #334155;
            border-radius: 4px;
            border: 1px solid #1e293b;
        }
        input[type=range]:focus {
            outline: none;
        }
    </style>
</head>
<body class="p-6">

    <div class="bento-card p-8 w-full max-w-4xl text-center">
        <h1 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-purple-500 mb-2 tracking-tight">AUTOMAÇÃO INDUSTRIAL - 2339N25</h1>
        <p class="text-slate-400 font-medium mb-8">Painel de Controle de Iluminação Remota</p>

        <div class="bg-slate-900/50 rounded-2xl p-5 mb-10 border border-slate-700/50 flex flex-col md:flex-row items-center justify-between gap-4">
            <div class="flex items-center w-full md:w-auto">
                <span id="status-indicator" class="w-3 h-3 rounded-full bg-yellow-500 mr-3 animate-pulse shadow-[0_0_8px_rgba(234,179,8,0.8)]"></span>
                <span id="status-text" class="text-sm font-bold text-slate-300 uppercase tracking-wider">Conectando...</span>
            </div>
            <div class="flex-1 w-full max-w-md">
                <input type="text" id="topic-input" value="Alisson_Martins_led_exclusivo/arduino" 
                    class="w-full px-4 py-2 rounded-lg border border-slate-600 bg-slate-800 text-cyan-400 text-sm focus:ring-2 focus:ring-cyan-500 focus:outline-none transition-shadow text-center font-mono">
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-slate-900/40 rounded-2xl p-6 border border-slate-700/30 flex flex-col items-center">
                <div class="w-full flex justify-between items-center mb-6">
                    <p class="text-sm font-bold text-slate-400 uppercase tracking-wider">Porta 13</p>
                    <span id="badge-13" class="text-[10px] font-bold px-2 py-1 rounded-full bg-slate-700 text-slate-400">INATIVA</span>
                </div>
                <div class="relative flex items-center justify-center mb-6">
                    <div class="absolute inset-0 rounded-full border border-slate-600 border-dashed animate-[spin_10s_linear_infinite] opacity-50 scale-125"></div>
                    <div id="led1" class="w-24 h-24 rounded-full led-off transition-all duration-300 relative flex items-center justify-center z-10">
                        <svg class="w-8 h-8 text-white/70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"></path></svg>
                    </div>
                </div>
                <button onclick="publishMessage('1')" class="action-btn w-full py-3 bg-slate-800 hover:bg-gradient-to-r hover:from-cyan-500 hover:to-blue-500 text-white font-bold rounded-xl border border-slate-700 hover:border-transparent active:scale-95 transition-all disabled:opacity-50 flex justify-center items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                    LIGAR 13
                </button>
            </div>

            <div class="bg-slate-900/40 rounded-2xl p-6 border border-slate-700/30 flex flex-col items-center">
                <div class="w-full flex justify-between items-center mb-6">
                    <p class="text-sm font-bold text-slate-400 uppercase tracking-wider">Porta 12</p>
                    <span id="badge-12" class="text-[10px] font-bold px-2 py-1 rounded-full bg-slate-700 text-slate-400">INATIVA</span>
                </div>
                <div class="relative flex items-center justify-center mb-6">
                    <div class="absolute inset-0 rounded-full border border-slate-600 border-dashed animate-[spin_10s_linear_infinite] opacity-50 scale-125"></div>
                    <div id="led2" class="w-24 h-24 rounded-full led-off transition-all duration-300 relative flex items-center justify-center z-10">
                        <svg class="w-8 h-8 text-white/70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"></path></svg>
                    </div>
                </div>
                <button onclick="publishMessage('2')" class="action-btn w-full py-3 bg-slate-800 hover:bg-gradient-to-r hover:from-cyan-500 hover:to-blue-500 text-white font-bold rounded-xl border border-slate-700 hover:border-transparent active:scale-95 transition-all disabled:opacity-50 flex justify-center items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                    LIGAR 12
                </button>
            </div>

            <div class="bg-slate-900/40 rounded-2xl p-6 border border-slate-700/30 flex flex-col items-center">
                <div class="w-full flex justify-between items-center mb-6">
                    <p class="text-sm font-bold text-slate-400 uppercase tracking-wider">Porta 11</p>
                    <span id="badge-11" class="text-[10px] font-bold px-2 py-1 rounded-full bg-slate-700 text-slate-400">INATIVA</span>
                </div>
                <div class="relative flex items-center justify-center mb-6">
                    <div class="absolute inset-0 rounded-full border border-slate-600 border-dashed animate-[spin_10s_linear_infinite] opacity-50 scale-125"></div>
                    <div id="led3" class="w-24 h-24 rounded-full led-off transition-all duration-300 relative flex items-center justify-center z-10">
                        <svg class="w-8 h-8 text-white/70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"></path></svg>
                    </div>
                </div>
                <button onclick="publishMessage('3')" class="action-btn w-full py-3 bg-slate-800 hover:bg-gradient-to-r hover:from-cyan-500 hover:to-blue-500 text-white font-bold rounded-xl border border-slate-700 hover:border-transparent active:scale-95 transition-all disabled:opacity-50 flex justify-center items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                    LIGAR 11
                </button>
            </div>
        </div>

        <div class="bg-slate-900/40 rounded-2xl p-6 mb-10 border border-slate-700/30">
            <div class="flex justify-between items-center mb-4">
                <span class="text-sm font-bold text-slate-300 uppercase tracking-wider flex items-center gap-2">
                    <svg class="w-5 h-5 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                    Intensidade PWM (Porta 11)
                </span>
                <span id="pwm-valor" class="text-2xl font-black text-cyan-400">100%</span>
            </div>
            <input type="range" id="pwm-slider" min="0" max="100" value="100" 
                   oninput="document.getElementById('pwm-valor').innerText = this.value + '%'"
                   onchange="publishMessage('PWM:' + this.value)"
                   class="w-full mt-2">
        </div>

        <div class="flex flex-wrap justify-center gap-4">
            <button onclick="publishMessage('4')" class="action-btn px-8 py-4 bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-500 hover:to-purple-500 text-white font-bold rounded-xl shadow-lg active:scale-95 transition-all disabled:opacity-50 tracking-widest text-sm flex items-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                LIGAR TODOS
            </button>
            <button onclick="publishMessage('0')" class="action-btn px-8 py-4 bg-slate-800 hover:bg-red-500 text-white font-bold rounded-xl shadow-lg border border-slate-700 hover:border-red-500 active:scale-95 transition-all disabled:opacity-50 tracking-widest text-sm">DESLIGAR SISTEMA</button>
        </div>
    </div>

    <script>
        const broker = "broker.hivemq.com";
        const port = 8884;
        const clientId = "web_" + Math.random().toString(16).substr(2, 8);
        const currentTopic = document.getElementById("topic-input").value;
        
        let mqttClient = new Paho.MQTT.Client(broker, port, clientId);
        let isConnected = false;

        function updateLedUI(ledId, badgeId, isOn) {
            const led = document.getElementById(ledId);
            const badge = document.getElementById(badgeId);
            if (isOn) {
                led.classList.remove('led-off');
                led.classList.add('led-on');
                badge.innerText = "ATIVA";
                badge.className = "text-[10px] font-bold px-2 py-1 rounded-full bg-cyan-500/20 text-cyan-400 border border-cyan-500/50 shadow-[0_0_8px_rgba(6,182,212,0.4)]";
            } else {
                led.classList.remove('led-on');
                led.classList.add('led-off');
                badge.innerText = "INATIVA";
                badge.className = "text-[10px] font-bold px-2 py-1 rounded-full bg-slate-700 text-slate-400";
            }
        }

        mqttClient.onConnectionLost = function() {
            isConnected = false;
            document.getElementById("status-indicator").className = "w-3 h-3 rounded-full bg-red-500 mr-3 shadow-[0_0_8px_rgba(239,68,68,0.8)]";
            document.getElementById("status-text").innerText = "OFFLINE";
            setTimeout(connectMQTT, 5000);
        };

        mqttClient.onMessageArrived = function(message) {
            const payload = message.payloadString;
            
            if (payload === '1') updateLedUI('led1', 'badge-13', true);
            else if (payload === '2') updateLedUI('led2', 'badge-12', true);
            else if (payload === '3') updateLedUI('led3', 'badge-11', true);
            else if (payload === '4') {
                updateLedUI('led1', 'badge-13', true);
                updateLedUI('led2', 'badge-12', true);
                updateLedUI('led3', 'badge-11', true);
            } 
            else if (payload === '0') {
                updateLedUI('led1', 'badge-13', false);
                updateLedUI('led2', 'badge-12', false);
                updateLedUI('led3', 'badge-11', false);
            }
            else if (payload.startsWith("PWM:")) {
                const pwmVal = payload.split(":")[1];
                document.getElementById('pwm-slider').value = pwmVal;
                document.getElementById('pwm-valor').innerText = pwmVal + '%';
            }
        };

        function connectMQTT() {
            try {
                mqttClient.connect({
                    useSSL: true,
                    onSuccess: function() {
                        isConnected = true;
                        document.getElementById("status-indicator").className = "w-3 h-3 rounded-full bg-emerald-500 mr-3 shadow-[0_0_12px_rgba(16,185,129,0.9)]";
                        document.getElementById("status-text").innerText = "SISTEMA ONLINE";
                        mqttClient.subscribe(currentTopic);
                    },
                    onFailure: function() {
                        setTimeout(connectMQTT, 5000);
                    }
                });
            } catch (error) {
                isConnected = true;
                document.getElementById("status-indicator").className = "w-3 h-3 rounded-full bg-purple-500 mr-3 shadow-[0_0_12px_rgba(168,85,247,0.9)] animate-pulse";
                document.getElementById("status-text").innerText = "MODO SIMULAÇÃO";
            }
        }

        function publishMessage(payload) {
            if (isConnected) {
                try {
                    let message = new Paho.MQTT.Message(payload);
                    message.destinationName = currentTopic;
                    mqttClient.send(message);
                } catch (e) {
                    let simMessage = { payloadString: payload };
                    mqttClient.onMessageArrived(simMessage);
                }
            }
        }

        connectMQTT();
    </script>
</body>
</html>
